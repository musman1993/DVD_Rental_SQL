# docker-compose.yml — lives at the repo root.
#
# Why Compose instead of two `docker run` commands: once a second container
# needs to talk to the first one, you need a shared network and a resolvable
# hostname between them, plus reliable startup ordering ("don't start the app
# until Postgres can actually accept queries, not just until the container
# process exists"). Compose gives you both declaratively instead of hand-
# rolling `docker network create` + `--network` flags + sleep-based waits.
#
# Compose automatically reads a `.env` file in this same directory and
# substitutes ${VAR} references below — copy .env.example to .env to override
# any default without touching this file.

services:
  db:
    build:
      context: ./postgres-setup
      dockerfile: dockerfile
    container_name: dvdrental-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dvdrental}
    ports:
      - "${HOST_PORT:-5432}:5432"
    volumes:
      - dvdrental-volume:/var/lib/postgresql/data
    # This healthcheck duplicates the one already baked into the postgres
    # image via HEALTHCHECK in the dockerfile — Compose needs its own
    # top-level `healthcheck:` block specifically so `depends_on.condition:
    # service_healthy` below has something to poll and react to.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dvdrental}"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      - dvdrental-net

  app:
    build:
      context: .              # repo root, so the Dockerfile can COPY pyproject.toml/uv.lock/app.py
      dockerfile: app/Dockerfile
    container_name: dvdrental-app
    environment:
      # "db" is not a placeholder — it's the literal Compose service name
      # above, and Compose's embedded DNS resolves it to that container's
      # address on the shared network. This is the whole reason app.py was
      # changed to read POSTGRES_HOST from the environment instead of
      # hardcoding "localhost".
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dvdrental}
    ports:
      - "8501:8501"
    depends_on:
      db:
        # service_started (Compose's default) only waits for the container
        # PROCESS to exist — it would let the app try to connect while
        # Postgres is still mid-restore (see doc 02's whole first-boot
        # sequence). service_healthy waits for the healthcheck above to
        # actually pass first, which removes that race condition entirely.
        condition: service_healthy
    networks:
      - dvdrental-net

networks:
  dvdrental-net:

volumes:
  dvdrental-volume:
